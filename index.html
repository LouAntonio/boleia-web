			`theme-color` segue o tema activo: o browser pinta a barra de

			O `App` actualiza este valor ao trocar de tema.
		-->
		<meta name="theme-color" content="#F5F7FB" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Boleia" />
